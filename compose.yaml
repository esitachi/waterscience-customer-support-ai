services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waterscience-support-ai
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
