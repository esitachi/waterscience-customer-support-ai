name: WaterScience Support AI - CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    name: Run Tests & Synthetic Benchmark
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: mock
      ENVIRONMENT: test
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (Unit, Integration & Generalization Tests)
        run: |
          python -m pytest -q

      - name: Run Synthetic Benchmark (20/20 Cases & Category Verification)
        run: |
          python generate_test_report.py

      - name: Upload Benchmark Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-report
          path: test_results_report.md
          if-no-files-found: error
